name: 问题反馈
description: 报告使用中遇到的问题
body:
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: TouhouNCM、网易云完整版本号和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与实际表现
      description: 说明操作步骤、期望结果和实际结果，可附截图。
    validations:
      required: true
